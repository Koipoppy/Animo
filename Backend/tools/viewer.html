<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>GLB 预览</title>
<style>
  html, body { margin: 0; height: 100%; background: #20262b; color: #dfe8e4; font: 14px system-ui, sans-serif; }
  #info { position: fixed; left: 12px; top: 10px; white-space: pre; pointer-events: none; text-shadow: 0 1px 2px #000; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="info">加载中…</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// Usage: viewer.html?model=/x.glb&yaw=0&pitch=0   (yaw/pitch in degrees orbit the camera around the model)
const params = new URLSearchParams(location.search);
const yaw = THREE.MathUtils.degToRad(Number(params.get("yaw") ?? 0));
const pitch = THREE.MathUtils.degToRad(Number(params.get("pitch") ?? 12));
const info = document.getElementById("info");

// Embedded browsers can report a 0x0 window at load time, so fall back to a fixed size and track resizes.
const viewSize = () => ({ w: innerWidth || 1100, h: innerHeight || 700 });
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(viewSize().w, viewSize().h);
document.body.appendChild(renderer.domElement);
addEventListener("resize", () => {
  const { w, h } = viewSize();
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
});

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a444b);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445055, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(2, 4, 3);
scene.add(sun);
scene.add(new THREE.GridHelper(2, 20, 0x667780, 0x4c5a62));
scene.add(new THREE.AxesHelper(0.4)); // red=+X, green=+Y, blue=+Z

const camera = new THREE.PerspectiveCamera(35, viewSize().w / viewSize().h, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);

new GLTFLoader().load(params.get("model"), (gltf) => {
  const model = gltf.scene;
  scene.add(model);
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) * 1.9;
  controls.target.copy(center);
  camera.position.set(
    center.x + radius * Math.cos(pitch) * Math.sin(yaw),
    center.y + radius * Math.sin(pitch),
    center.z + radius * Math.cos(pitch) * Math.cos(yaw),
  );
  controls.update();
  info.textContent = `size (x,y,z) = ${size.x.toFixed(3)}, ${size.y.toFixed(3)}, ${size.z.toFixed(3)} m\nmin.y = ${box.min.y.toFixed(3)}  center = ${center.x.toFixed(2)}, ${center.y.toFixed(2)}, ${center.z.toFixed(2)}\ncamera yaw ${params.get("yaw") ?? 0}°  (0° = looking from glTF +Z toward the origin)`;
  document.title = "ready";
}, undefined, (error) => { info.textContent = "加载失败: " + error; document.title = "error"; });

renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
</body>
</html>
